[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "T20",  # print statements (use structlog instead)
]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module imports not at top (caused by __future__ annotations pattern)
    "N806",  # variable in function should be lowercase
    "UP017", # datetime.UTC requires Python 3.12+; we're pinned to 3.11
]

[tool.ruff.lint.per-file-ignores]
"agents/ingestion/tests/fetch_ground_truth.py" = ["T20"]
"ingestion/tests/fetch_ground_truth.py" = ["T20"]
# CLI harness scripts intentionally print to stdout
"agents/common/events/view_harness.py" = ["T201"]
"common/events/view_harness.py" = ["T201"]
"agents/scripts/dedup_metrics_report.py" = ["T201"]
"scripts/dedup_metrics_report.py" = ["T201"]
"agents/scripts/ingest_duplicate_demo.py" = ["T201"]
"scripts/ingest_duplicate_demo.py" = ["T201"]
"agents/scripts/batch_ingest_borderplex.py" = ["T201"]
"scripts/batch_ingest_borderplex.py" = ["T201"]
"agents/scripts/run_processing_loop.py" = ["T201"]
"scripts/run_processing_loop.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["agents"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["."]
norecursedirs = [".venv", "__pycache__", "node_modules", ".git"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests requiring a live database",
    "fuzzy_dedup_e2e: PostgreSQL + Azure embedding fuzzy dedup matching E2E",
]
